# OpenHPC Technical Steering Committee (TSC) roster.
#
# This file is the machine-readable source of truth for TSC membership.
# TSC.md is generated from it; do not edit TSC.md by hand. After changing
# this file run:
#
#     ./scripts/render-tsc.py
#
# Terms run from July 1 to June 30. The first entry in `terms` is the
# current term. Roles:
#   project-lead, interim-project-lead, technical-lead, maintainer,
#   end-user-representative, component-development-representative,
#   testing-coordinator, member (used from 2025-2026 on, when the TSC
#   stopped assigning per-member roles)
#
# `email` and `github` are optional per member.

