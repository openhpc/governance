name: Check generated TSC files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-tsc:
    name: TSC.md matches tsc.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python3 -m pip install pyyaml

      - name: Verify TSC.md is generated from tsc.yaml
        run: ./scripts/render-tsc.py --check

      - name: Show the required change on failure
        if: failure()
        run: |
          ./scripts/render-tsc.py
          echo "::error::TSC.md is out of date. Run ./scripts/render-tsc.py and commit the result."
          git --no-pager diff
